<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b36">
  <title>AT Locações</title>
  <style>
    :root {
      color-scheme: light;
      --brand: #123b36;
      --brand-dark: #0b2925;
      --accent: #c6dfd2;
      --text: #172522;
      --muted: #66736f;
      --surface: #ffffff;
      --line: #e6ece9;
      --shadow: 0 18px 55px rgba(10, 35, 30, .18);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      background: #f7f9f8;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body.menu-open { overflow: hidden; }

    .topbar {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 76px;
      padding: 0 24px;
      background: var(--brand);
      color: white;
      box-shadow: 0 2px 12px rgba(11, 41, 37, .12);
    }

    .menu-toggle {
      display: inline-grid;
      place-items: center;
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      padding: 0;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 12px;
      background: transparent;
      color: white;
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease;
    }
    .menu-toggle:hover, .menu-toggle:focus-visible {
      background: rgba(255,255,255,.12);
      border-color: rgba(255,255,255,.55);
    }
    .menu-toggle:focus-visible, .close-menu:focus-visible, .nav-link:focus-visible {
      outline: 3px solid #a8d8c3;
      outline-offset: 3px;
    }
    .menu-toggle svg { width: 23px; height: 23px; }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
      color: white;
      text-decoration: none;
    }
    .brand-name {
      font-size: 19px;
      line-height: 1.1;
      font-weight: 750;
      letter-spacing: .04em;
    }
    .brand-caption {
      color: rgba(255,255,255,.72);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .menu-backdrop {
      position: fixed;
      z-index: 10;
      inset: 0;
      background: rgba(7, 23, 20, .48);
      opacity: 0;
      visibility: hidden;
      transition: opacity .25s ease, visibility .25s ease;
    }
    .menu-backdrop.is-visible { opacity: 1; visibility: visible; }

    .side-menu {
      position: fixed;
      z-index: 11;
      inset: 0 auto 0 0;
      display: flex;
      flex-direction: column;
      width: min( min(340px, 88vw), 340px);
      padding: 25px 20px;
      background: var(--surface);
      box-shadow: var(--shadow);
      transform: translateX(-105%);
      transition: transform .28s cubic-bezier(.2,.75,.25,1);
      visibility: hidden;
    }
    .side-menu.is-open { transform: translateX(0); visibility: visible; }

    .menu-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 3px 2px 24px;
      border-bottom: 1px solid var(--line);
    }
    .menu-heading strong {
      color: var(--brand);
      font-size: 17px;
      letter-spacing: .02em;
    }
    .close-menu {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 10px;
      background: #f0f5f2;
      color: var(--brand);
      cursor: pointer;
    }
    .close-menu:hover { background: #e4eee8; }
    .close-menu svg { width: 20px; height: 20px; }

    .nav-label {
      margin: 25px 10px 10px;
      color: #87938e;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .nav-list { display: grid; gap: 6px; }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 49px;
      padding: 0 12px;
      border-radius: 11px;
      color: #34433e;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: color .18s ease, background .18s ease;
    }
    .nav-link:hover, .nav-link[aria-current="page"] {
      background: #edf5f0;
      color: var(--brand);
    }
    .nav-link svg { width: 19px; height: 19px; color: #648077; }

    .menu-footer {
      margin-top: auto;
      padding: 18px 10px 4px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    main {
      width: min(100% - 40px, 1100px);
      margin: 0 auto;
      padding: 54px 0;
    }
    .welcome {
      padding: 34px;
      border: 1px solid #e8eeeb;
      border-radius: 18px;
      background: white;
      box-shadow: 0 8px 30px rgba(18, 59, 54, .04);
    }
    .welcome .eyebrow {
      margin: 0 0 10px;
      color: #648077;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .welcome h1 {
      margin: 0;
      color: var(--brand-dark);
      font-size: clamp(25px, 4vw, 36px);
      line-height: 1.15;
      letter-spacing: -.03em;
    }
    .welcome p {
      max-width: 560px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    @media (max-width: 600px) {
      .topbar { min-height: 68px; padding: 0 16px; gap: 12px; }
      .menu-toggle { width: 43px; height: 43px; flex-basis: 43px; }
      .brand-name { font-size: 17px; }
      main { width: min(100% - 28px, 1100px); padding: 28px 0; }
      .welcome { padding: 25px 21px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <button class="menu-toggle" id="menuToggle" type="button" aria-label="Abrir menu" aria-controls="sideMenu" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
    <a class="brand" href="#inicio" aria-label="AT Locações - início">
      <span class="brand-name">AT LOCAÇÕES</span>
      <span class="brand-caption">Locação para eventos</span>
    </a>
  </header>

  <div class="menu-backdrop" id="menuBackdrop" aria-hidden="true"></div>

  <aside class="side-menu" id="sideMenu" aria-label="Menu principal" aria-hidden="true">
    <div class="menu-heading">
      <strong>Menu principal</strong>
      <button class="close-menu" id="closeMenu" type="button" aria-label="Fechar menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m18 6-12 12M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <p class="nav-label">Navegação</p>
    <nav class="nav-list">
      <a class="nav-link" href="#inicio" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"></path></svg>
        Início
      </a>
      <a class="nav-link" href="#catalogo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path><path d="M7 4v16M17 4v16"></path></svg>
        Catálogo
      </a>
      <a class="nav-link" href="#orcamentos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10l3 3v15H4V3z"></path><path d="M8 11h8M8 15h8M8 7h3"></path></svg>
        Orçamentos
      </a>
      <a class="nav-link" href="#contato">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4z"></path><path d="m4 7 8 6 8-6"></path></svg>
        Contato
      </a>
    </nav>

    <div class="menu-footer">AT Locações<br>Praticidade para organizar seu evento.</div>
  </aside>

  <main id="inicio">
    <section class="welcome">
      <p class="eyebrow">AT Locações</p>
      <h1>Organize seu evento com praticidade.</h1>
      <p>Use o menu no canto superior esquerdo para acessar a navegação do projeto.</p>
    </section>
  </main>

  <script>
    (() => {
      const toggle = document.getElementById('menuToggle');
      const close = document.getElementById('closeMenu');
      const menu = document.getElementById('sideMenu');
      const backdrop = document.getElementById('menuBackdrop');
      const links = menu.querySelectorAll('.nav-link');

      function openMenu() {
        menu.classList.add('is-open');
        backdrop.classList.add('is-visible');
        menu.setAttribute('aria-hidden', 'false');
        backdrop.setAttribute('aria-hidden', 'false');
        toggle.setAttribute('aria-expanded', 'true');
        toggle.setAttribute('aria-label', 'Fechar menu');
        document.body.classList.add('menu-open');
        close.focus();
      }

      function closeMenu() {
        menu.classList.remove('is-open');
        backdrop.classList.remove('is-visible');
        menu.setAttribute('aria-hidden', 'true');
        backdrop.setAttribute('aria-hidden', 'true');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-label', 'Abrir menu');
        document.body.classList.remove('menu-open');
        toggle.focus();
      }

      toggle.addEventListener('click', () => {
        menu.classList.contains('is-open') ? closeMenu() : openMenu();
      });
      close.addEventListener('click', closeMenu);
      backdrop.addEventListener('click', closeMenu);
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && menu.classList.contains('is-open')) closeMenu();
      });
      links.forEach((link) => link.addEventListener('click', closeMenu));
    })();
  </script>
</body>
</html>
